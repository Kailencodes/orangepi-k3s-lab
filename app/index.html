<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krakow · Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe8; --card:#fffdf9; --ink:#2c2a25; --muted:#8a857a; --faint:#b2ab9d;
    --line:#e8e1d6; --line2:#f0ebe2;
    --sage:#8a9a78; --sage-deep:#6f7e5d; --oak:#c2a079; --blue:#8fa6b8; --terra:#c2774f;
    --serif:'Fraunces',Georgia,serif; --mono:'JetBrains Mono',monospace;
    --shadow:0 1px 2px rgba(54,48,38,.04),0 10px 28px rgba(54,48,38,.05);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(1100px 620px at 6% -10%,rgba(138,154,120,.13),transparent 60%),
      radial-gradient(1000px 620px at 100% 0%,rgba(194,160,121,.13),transparent 58%);
  }
  .screen{height:100vh;display:flex;flex-direction:column;padding:26px 30px 30px;gap:18px}

  /* Header bar */
  .bar{flex:none;display:flex;align-items:center;gap:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .logo{width:44px;height:44px;border-radius:13px;flex:none;background:linear-gradient(140deg,var(--sage),var(--oak));
    box-shadow:0 8px 20px rgba(138,154,120,.28);position:relative}
  .logo::after{content:"";position:absolute;inset:12px;border-radius:6px;border:2px solid rgba(255,253,249,.9)}
  .bar h1{font-family:var(--serif);font-size:1.5rem;font-weight:500;letter-spacing:-.01em}
  .bar h1 span{color:var(--oak)}
  .bar .tag{color:var(--muted);font-size:.78rem;margin-top:1px}
  .bar .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;font-size:.74rem;
    font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
  .clock{font-family:var(--mono);font-size:.92rem;color:var(--muted);min-width:96px;text-align:right}

  .dot{width:9px;height:9px;border-radius:50%;background:var(--sage);flex:none;
    box-shadow:0 0 0 0 rgba(138,154,120,.55);animation:ping 2.2s infinite}
  .dot.off{background:var(--terra);animation:none;box-shadow:none}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(138,154,120,.5)}70%{box-shadow:0 0 0 8px rgba(138,154,120,0)}100%{box-shadow:0 0 0 0 rgba(138,154,120,0)}}

  /* Fleet grid */
  .grid{flex:1;display:grid;gap:18px;min-height:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 24px;
    display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden;box-shadow:var(--shadow);position:relative}
  .panel.off{opacity:.62}
  .panel.off::after{content:"OFFLINE";position:absolute;top:18px;right:24px;font-size:.62rem;letter-spacing:.16em;
    color:var(--terra);font-weight:700}

  .p-head{display:flex;align-items:center;gap:11px;flex:none}
  .p-head h2{font-family:var(--serif);font-weight:500;font-size:1.28rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .role{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#eef0e9;color:var(--sage-deep)}
  .role.test{background:#f4e9e0;color:#a86a3c}.role.infra{background:#e8edf1;color:#5e7588}.role.client{background:#efeae4;color:#8a7a63}
  .p-head .meta{margin-left:auto;text-align:right;font-size:.72rem;color:var(--faint);line-height:1.35}
  .p-head .meta b{font-family:var(--mono);color:var(--muted);font-weight:500}

  /* Host body */
  .h-main{display:flex;align-items:center;gap:26px;flex:none}
  .gauges{display:flex;gap:18px}
  .g{position:relative;width:96px;height:96px;display:flex;flex-direction:column;align-items:center}
  .g svg{transform:rotate(-90deg)}
  .gt{fill:none;stroke:#ece6dc;stroke-width:8}
  .ga{fill:none;stroke-width:8;stroke-linecap:round}
  .gv{position:absolute;top:30px;left:0;width:96px;display:flex;align-items:baseline;justify-content:center;gap:1px}
  .gv b{font-family:var(--serif);font-size:1.5rem;font-weight:500}.gv i{font-style:normal;font-size:.7rem;color:var(--faint)}
  .gl{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;flex:1}
  .tile span{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:block}
  .tile b{font-family:var(--serif);font-size:1.3rem;font-weight:500;display:block;line-height:1.15}
  .tile.up b{color:var(--sage-deep)}.tile.down b{color:var(--blue)}

  .sys{font-size:.74rem;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}

  .spark{flex:1;min-height:0;position:relative}
  .spark svg{position:absolute;inset:0;width:100%;height:100%}
  .nodata{color:var(--faint);font-size:.78rem;font-style:italic;padding:14px 0}

  .p-foot{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:.7rem;padding:4px 9px;border-radius:7px;border:1px solid rgba(138,154,120,.4);
    background:rgba(138,154,120,.1);color:var(--sage-deep)}
  .k8s{margin-left:auto;font-size:.72rem;color:var(--muted)}
  .k8s b{font-family:var(--mono);color:var(--sage-deep)}
  .empty{color:var(--faint);font-size:.74rem;font-style:italic}

  /* Probe body */
  .pr-main{display:flex;gap:20px;flex:none}
  .pr-main .tile b{font-size:1.7rem}
  .pr-main .tile.big b{font-family:var(--serif);font-size:2.3rem;color:var(--sage-deep)}
  .legend{display:flex;gap:16px;font-size:.68rem;color:var(--muted);align-items:center;flex:none}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .legend .peak{margin-left:auto;font-family:var(--mono);color:var(--faint)}
</style>
</head>
<body>
<div class="screen">
  <div class="bar">
    <div class="logo"></div>
    <div>
      <h1>Krakow <span>//</span> Fleet</h1>
      <div class="tag">Network &amp; System Monitor · live</div>
    </div>
    <div class="spacer"></div>
    <span class="pill"><span class="dot" id="fleet-dot"></span><span id="fleet-status">— / — online</span></span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const REFRESH=4000, STALE=30;
const NODE_FALLBACK=[{id:'krakow',label:'Krakow — Monitor',role:'monitor',kind:'host'}];
let NODES=[], DATA={};

const fmtBytes=(b,p='')=>{if(!b||b<1)return'0 B'+p;const k=1024,u=['B','KB','MB','GB','TB'];
  const i=Math.min(u.length-1,Math.floor(Math.log(b)/Math.log(k)));return (b/Math.pow(k,i)).toFixed(i?1:0)+' '+u[i]+p;};
const isFresh=d=>!!(d&&d.timestamp&&(Date.now()/1000-d.timestamp)<STALE);
const ago=ts=>{const s=Math.max(0,Math.floor(Date.now()/1000-ts));return s<60?s+'s ago':Math.floor(s/60)+'m ago';};
const days=s=>Math.floor((s||0)/86400);
const upfmt=s=>{const d=days(s),h=Math.floor((s%86400)/3600);return d+'d '+h+'h';};

function gauge(label,val){
  const v=Math.max(0,Math.min(100,Math.round(val||0))),r=40,C=2*Math.PI*r,off=C*(1-v/100);
  const col=v<88?(label==='CPU'?'#8a9a78':'#8fa6b8'):'#c2774f';
  return `<div class="g"><svg width="96" height="96">
      <circle cx="48" cy="48" r="${r}" class="gt"/>
      <circle cx="48" cy="48" r="${r}" class="ga" stroke="${col}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg><div class="gv"><b>${v}</b><i>%</i></div><span class="gl">${label}</span></div>`;
}

function sparkBW(history){
  if(!history||history.length<2)return '<div class="nodata">gathering…</div>';
  const max=Math.max(1,...history.map(h=>Math.max(h.up||0,h.down||0))),n=history.length;
  const X=i=>(i/(n-1)*100).toFixed(2),Y=v=>(96-(v/max*86)).toFixed(2);
  const up=history.map((h,i)=>`${X(i)},${Y(h.up||0)}`).join(' ');
  const dn=history.map((h,i)=>`${X(i)},${Y(h.down||0)}`).join(' ');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs>
      <linearGradient id="fu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(138,154,120,.30)"/><stop offset="1" stop-color="rgba(138,154,120,0)"/></linearGradient></defs>
      <polygon points="${up} 100,100 0,100" fill="url(#fu)"/>
      <polyline points="${up}" fill="none" stroke="#8a9a78" stroke-width="0.9" vector-effect="non-scaling-stroke"/>
      <polyline points="${dn}" fill="none" stroke="#8fa6b8" stroke-width="0.9" vector-effect="non-scaling-stroke"/>
    </svg>`;
}
function sparkLat(history){
  const pts=(history||[]).filter(h=>h.latency!=null);
  if(pts.length<2)return '<div class="nodata">gathering…</div>';
  const max=Math.max(1,...pts.map(h=>h.latency)),n=pts.length;
  const X=i=>(i/(n-1)*100).toFixed(2),Y=v=>(96-(v/max*86)).toFixed(2);
  const line=pts.map((h,i)=>`${X(i)},${Y(h.latency)}`).join(' ');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs>
      <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(143,166,184,.30)"/><stop offset="1" stop-color="rgba(143,166,184,0)"/></linearGradient></defs>
      <polygon points="${line} 100,100 0,100" fill="url(#fl)"/>
      <polyline points="${line}" fill="none" stroke="#8fa6b8" stroke-width="0.9" vector-effect="non-scaling-stroke"/>
    </svg>`;
}
function chips(ports){
  return (ports&&ports.length)?ports.map(p=>`<span class="chip">:${p.port}</span>`).join(''):'<span class="empty">no open ports</span>';
}

function panelHost(n,d,on){
  const r=(d&&d.resources)||{}, s=(d&&d.system)||{}, bw=(d&&d.bandwidth)||{}, net=(d&&d.network)||{};
  const meta=d?`<b>${s.ip||'—'}</b><br>updated ${ago(d.timestamp)}`:'no data yet';
  const k8s=(n.role==='monitor'&&d&&d.cluster&&d.cluster.reachable)
    ? `<div class="k8s">K3s · <b>${d.cluster.nodes_ready}/${d.cluster.nodes_total}</b> nodes · <b>${d.cluster.pods_running}/${d.cluster.pods_total}</b> pods</div>`:'';
  return `<div class="p-head"><span class="dot ${on?'':'off'}"></span><h2>${n.label}</h2>
      <span class="role ${n.role}">${n.role}</span><div class="meta">${meta}</div></div>
    <div class="h-main">
      <div class="gauges">${gauge('CPU',r.cpu_percent)}${gauge('MEM',r.memory_percent)}</div>
      <div class="tiles">
        <div class="tile"><span>Uptime</span><b>${d?upfmt(s.uptime):'—'}</b></div>
        <div class="tile"><span>Connections</span><b>${d?((d.connections&&d.connections.total)||0):'—'}</b></div>
        <div class="tile up"><span>▲ Upload</span><b>${d?fmtBytes(bw.upload_speed,'/s'):'—'}</b></div>
        <div class="tile down"><span>▼ Download</span><b>${d?fmtBytes(bw.download_speed,'/s'):'—'}</b></div>
      </div>
    </div>
    <div class="sys">${s.hostname||'—'} · ${s.os||''} · ${r.cpu_cores||'?'} cores · ${fmtBytes(r.memory_used)} / ${fmtBytes(r.memory_total)}</div>
    <div class="spark">${sparkBW(d&&d.history)}</div>
    <div class="p-foot">${chips(d&&d.scan_results)}${k8s}</div>`;
}

function panelProbe(n,d,on){
  const p=(d&&d.probe)||{}, meta=d?`<b>${p.target||n.target||'—'}</b><br>updated ${ago(d.timestamp)}`:'no data yet';
  const lat=d&&p.status==='online'?(p.latency_ms+' ms'):'—';
  const loss=d?(p.packet_loss!=null?p.packet_loss+'%':'—'):'—';
  return `<div class="p-head"><span class="dot ${on?'':'off'}"></span><h2>${n.label}</h2>
      <span class="role ${n.role}">${n.role}</span><div class="meta">${meta}</div></div>
    <div class="pr-main">
      <div class="tile big"><span>Latency</span><b>${lat}</b></div>
      <div class="tile"><span>Packet Loss</span><b>${loss}</b></div>
      <div class="tile"><span>Status</span><b style="color:${on?'var(--sage-deep)':'var(--terra)'}">${d?(p.status||'unknown').toUpperCase():'—'}</b></div>
    </div>
    <div class="legend"><span><i style="background:#8fa6b8"></i>Round-trip latency</span></div>
    <div class="spark">${sparkLat(d&&d.history)}</div>
    <div class="p-foot">${chips(d&&d.scan_results)}</div>`;
}

function layout(n){
  const cols=Math.min(n,Math.ceil(Math.sqrt(n))),rows=Math.ceil(n/cols);
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  g.style.gridTemplateRows=`repeat(${rows},1fr)`;
}
function render(){
  const g=document.getElementById('grid');
  g.innerHTML=NODES.map(n=>{
    const d=DATA[n.id], on=isFresh(d);
    const body=(n.kind==='probe')?panelProbe(n,d,on):panelHost(n,d,on);
    return `<div class="panel ${d&&!on?'off':''}">${body}</div>`;
  }).join('');
}

async function loadNodes(){
  try{const r=await fetch('data/nodes.json?t='+Date.now(),{cache:'no-store'});const j=r.ok?await r.json():null;
    NODES=(Array.isArray(j)&&j.length)?j:NODE_FALLBACK;}catch(e){NODES=NODE_FALLBACK;}
  layout(NODES.length);
}
async function fetchNode(id){
  try{const r=await fetch('data/'+id+'.json?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;}catch(e){return null;}
}
async function tick(){
  const res=await Promise.all(NODES.map(n=>fetchNode(n.id)));
  NODES.forEach((n,i)=>DATA[n.id]=res[i]);
  render();
  const online=NODES.filter(n=>isFresh(DATA[n.id])).length;
  document.getElementById('fleet-status').textContent=`${online} / ${NODES.length} online`;
  document.getElementById('fleet-dot').className='dot'+(online?'':' off');
  document.getElementById('clock').textContent=new Date().toLocaleTimeString();
}
(async()=>{await loadNodes();await tick();setInterval(tick,REFRESH);
  setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString(),1000);})();
</script>
</body>
</html>

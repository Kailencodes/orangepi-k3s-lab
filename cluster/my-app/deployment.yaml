apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: web
          # Stock nginx — no custom image to build or push. The dashboard is
          # served straight from the repo's app/ dir via the hostPath mount
          # below, so a `git pull` + browser refresh is all it takes to update.
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web
          # The scanner writes network_data.json into this same dir on the host;
          # nginx serves it as a static file. One directory, one source of truth.
          hostPath:
            path: /home/orangepi/orangepi-k3s-lab/app
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  namespace: default
spec:
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
